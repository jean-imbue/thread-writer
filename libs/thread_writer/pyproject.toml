[project]
name = "thread-writer"
version = "0.1.0"
description = "Turn Imbue blog posts into X threads and read them in a Typefully-style view"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "flask>=3.0",
    "flask-sock>=0.7",
    "httpx>=0.27",
    "litellm>=1.88.1",
    "loguru>=0.7",
    "openai>=2.20.0",
    "werkzeug>=3.0",
]

[project.scripts]
thread-writer = "thread_writer.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thread_writer"]
